
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Форма додавання нового товару до навчального каталогу.">
  <title>Додати товар | Каталог техніки</title>
</head>
<body>
  <header>
    <h1>Додати товар до каталогу</h1>
    <nav aria-label="Головна навігація">
      <a href="index.html">Головна</a>
      <a href="item.html">Сторінка товару</a>
      <a href="add.html">Додати товар</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Інформація про товар</h2>
      <form action="/add" method="post">
        <p>
          <label for="name">Назва товару:</label>
          <input type="text" id="name" name="name" required maxlength="100">
        </p>

        <p>
          <label for="email">Електронна пошта автора:</label>
          <input type="email" id="email" name="email" required>
        </p>

        <p>
          <label for="price">Ціна (грн):</label>
          <input type="number" id="price" name="price" min="1" max="10000000" required>
        </p>

        <p>
          <label for="date">Дата додавання:</label>
          <input type="date" id="date" name="date">
        </p>

        <p>
          <label for="url">Посилання на товар:</label>
          <input type="url" id="url" name="url">
        </p>

        <p>
          <label for="phone">Телефон для зв'язку:</label>
          <input type="tel" id="phone" name="phone">
        </p>

        <p>
          <label for="category">Категорія:</label>
          <select id="category" name="category" required>
            <option value="">Оберіть категорію</option>
            <option value="cameras">Фотоапарати</option>
            <option value="lenses">Об'єктиви</option>
            <option value="accessories">Аксесуари</option>
          </select>
        </p>

        <fieldset>
          <legend>Стан товару</legend>
          <p>
            <input type="radio" id="new" name="condition" value="new" required>
            <label for="new">Новий</label>
          </p>
          <p>
            <input type="radio" id="used" name="condition" value="used">
            <label for="used">Вживаний</label>
          </p>
        </fieldset>

        <p>
          <input type="checkbox" id="agreement" name="agreement" required>
          <label for="agreement">Підтверджую правильність даних</label>
        </p>

        <p>
          <label for="description">Опис товару:</label>
          <textarea id="description" name="description" rows="5" maxlength="1000"></textarea>
        </p>

        <button type="submit">Надіслати товар</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Навчальний проєкт. Автор: Луканіна Анастасія, Ж-Б 4.01.</p>
  </footer>
</body>
</html>
